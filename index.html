    <style>
        @font-face {
            font-family: 'Minecraft Rus';

            font-style: normal;
        }


        body {
            font-family: 'Minecraft Rus', sans-serif;
            text-rendering: optimizeSpeed;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;
            background: linear-gradient(to right, rgb(21, 21, 21), rgb(28, 28, 28));
            position: relative;
            min-height: 100vh;
            margin: 0;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgb(189, 189, 189), rgb(179, 179, 179));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.8s ease;   
        }

        body.light-theme::before {
            opacity: 1;
        }

        .switch {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            width: 60px;
            height: 26px;
        }

        .toggle {
            opacity: 0;
            width: 0;
            height: 0;
        }

<script>
    const switchSound = new Audio('sounds/click1.mp3');
    switchSound.preload = 'auto';

    const buttonSound = new Audio('sounds/click2.mp3');
    buttonSound.preload = 'auto';

    const soundToggleSound = new Audio('sounds/click-toggle.mp3');
    soundToggleSound.preload = 'auto';

    const authorButtonSound = new Audio('sounds/click3.mp3');
    authorButtonSound.preload = 'auto';

    let soundEnabled;
    function playSound(audio) {
        if (soundEnabled) {
            audio.currentTime = 0;
            audio.play();
        }
    }

    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('change', function() {
        playSound(switchSound);
        if (themeToggle.checked) {
            document.body.classList.remove('light-theme');
        } else {
            document.body.classList.add('light-theme');
        }
    });

    const soundToggle = document.getElementById('soundToggle');
    soundEnabled = soundToggle.checked;
    soundToggle.addEventListener('change', function() {
        soundEnabled = soundToggle.checked;
        if (soundEnabled) {
            soundToggleSound.currentTime = 0;
            soundToggleSound.play();
        }
    });

    const musicAudio = new Audio('sounds/music.mp3');
    musicAudio.preload = 'auto';
    musicAudio.loop = true;

    const musicToggle = document.getElementById('musicToggle');
    musicToggle.addEventListener('change', function() {
        playSound(switchSound);  
        if (musicToggle.checked) {
            musicAudio.currentTime = 0;
            musicAudio.play();
        } else {
            musicAudio.pause();
            musicAudio.currentTime = 0;
        }
    });

    const newButton = document.querySelector('.box-button');
    newButton.addEventListener('click', function() {
        playSound(buttonSound);
    });

    const authorButton = document.querySelector('.box-button2');
    authorButton.addEventListener('click', function() {
        playSound(authorButtonSound);
        overlay.classList.add('open');
        adminModal.classList.add('open');
    });

    const overlay = document.getElementById('overlay');
    const adminModal = document.getElementById('adminModal');
    const closeModalBtn = document.getElementById('closeModal');

    closeModalBtn.addEventListener('click', function() {
        overlay.classList.remove('open');
        adminModal.classList.remove('open');
    });
    overlay.addEventListener('click', function() {
        overlay.classList.remove('open');
        adminModal.classList.remove('open');
    });


    const dolButtons = document.querySelectorAll('.dol');
    dolButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            playSound(buttonSound);
        });
    });

    document.body.classList.add('light-theme');
</script>
